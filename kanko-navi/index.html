<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root { color-scheme: light; padding: env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px); }
  html, body { margin: 0; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
</style>
<title>きせつ観光ナビ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
  /* レイアウト: 縦1カラム。入力パネル→スポット→ご飯の順。和風トラベル */
  :root {
    --bg: #f4efe6;
    --surface: #fffdf8;
    --ink: #2b2a26;
    --ink-soft: #6f6a60;
    --line: #e4dccd;
    --accent: #1f4e6b;        /* 藍色 */
    --accent-soft: #e7eef2;
    --food: #b5432f;          /* ご飯セクションの朱色 */
    --food-soft: #f6e7e2;
    --spring: #d6678b;
    --summer: #2a9d8f;
    --autumn: #c96a2a;
    --winter: #3f72af;
    --shadow: 0 1px 2px rgba(43,42,38,.06), 0 8px 24px rgba(43,42,38,.07);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1a1916; --surface: #24231f; --ink: #efe9dc; --ink-soft: #a9a294;
      --line: #38362f; --accent: #7fb4d4; --accent-soft: #223240;
      --food: #e08466; --food-soft: #3a2824;
      --spring: #e488a6; --summer: #4fc0b2; --autumn: #e08b4e; --winter: #6f9bd8;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1a1916; --surface: #24231f; --ink: #efe9dc; --ink-soft: #a9a294;
    --line: #38362f; --accent: #7fb4d4; --accent-soft: #223240;
    --food: #e08466; --food-soft: #3a2824;
    --spring: #e488a6; --summer: #4fc0b2; --autumn: #e08b4e; --winter: #6f9bd8;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); font-family: "Zen Kaku Gothic New", system-ui, sans-serif; line-height: 1.7; }
  .wrap {
    max-width: 780px; margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 28px 56px;
  }

  header { text-align: center; margin-bottom: 24px; }
  .eyebrow { font-size: .8rem; letter-spacing: .22em; color: var(--accent); font-weight: 700; margin: 0 0 8px; }
  h1 { font-family: "Shippori Mincho", serif; font-weight: 700; font-size: clamp(1.9rem, 6vw, 2.6rem); margin: 0; text-wrap: balance; letter-spacing: .02em; }
  .lead { color: var(--ink-soft); margin: 10px 0 0; font-size: .96rem; }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 22px; display: grid; gap: 16px; }
  .field { display: grid; gap: 7px; }
  label { font-weight: 700; font-size: .92rem; }
  .hint { font-weight: 400; color: var(--ink-soft); font-size: .82rem; }
  select, input[type="date"], input[type="text"] {
    font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 12px 13px; width: 100%;
  }
  select:focus-visible, input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .row { display: grid; gap: 16px; grid-template-columns: 1fr 1fr; }
  @media (max-width: 460px) { .row { grid-template-columns: 1fr; } }

  button.go { font: inherit; font-weight: 700; font-size: 1.02rem; color: #fff; background: var(--accent); border: none; border-radius: 10px; padding: 14px; cursor: pointer; transition: filter .15s ease, transform .05s ease; }
  button.go:hover { filter: brightness(1.08); }
  button.go:active { transform: translateY(1px); }

  .result { margin-top: 32px; }
  .result-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 12px; margin-bottom: 4px; }
  .result-head h2 { font-family: "Shippori Mincho", serif; font-size: 1.5rem; margin: 0; font-weight: 700; }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 4px; }
  .chip-tag { display: inline-flex; align-items: center; gap: 6px; font-size: .85rem; font-weight: 700; padding: 4px 11px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
  .result-note { color: var(--ink-soft); font-size: .9rem; margin: 6px 0 16px; }

  /* カテゴリしぼりこみ */
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .filters button {
    font: inherit; font-size: .85rem; font-weight: 700; cursor: pointer;
    padding: 6px 13px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--surface); color: var(--ink-soft);
  }
  .filters button[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }

  .cards { display: grid; gap: 14px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--seasonc, var(--line)); border-radius: 14px; padding: 16px 18px; box-shadow: var(--shadow); }
  .card-top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 6px; }
  .card h3 { font-family: "Shippori Mincho", serif; font-size: 1.18rem; margin: 0; font-weight: 700; min-width: 0; }
  .badge { font-size: .74rem; font-weight: 700; letter-spacing: .04em; padding: 3px 9px; border-radius: 999px; color: #fff; background: var(--seasonc, var(--ink-soft)); white-space: nowrap; }
  .badge.cat { color: var(--ink-soft); background: transparent; border: 1px solid var(--line); }
  .pick { font-size: .74rem; font-weight: 700; color: var(--accent); background: var(--accent-soft); padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
  .pick.rain { color: #fff; background: var(--winter); }
  .card p { margin: 0; color: var(--ink); font-size: .95rem; }
  .card .why { margin-top: 7px; color: var(--ink-soft); font-size: .86rem; }

  /* ご飯セクション */
  .food-sec { margin-top: 34px; background: var(--food-soft); border: 1px solid var(--line); border-radius: 18px; padding: 22px 20px; }
  .food-head { display: flex; align-items: center; gap: 10px; margin: 0 0 4px; }
  .food-head h2 { font-family: "Shippori Mincho", serif; font-size: 1.45rem; margin: 0; font-weight: 700; color: var(--food); }
  .food-sub { color: var(--ink-soft); font-size: .88rem; margin: 0 0 16px; }
  .food-grid { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
  @media (max-width: 520px) { .food-grid { grid-template-columns: 1fr; } }
  .food-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 15px; display: flex; flex-direction: column; gap: 5px; }
  .food-card .ftop { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; }
  .food-card h4 { font-family: "Shippori Mincho", serif; font-size: 1.08rem; margin: 0; font-weight: 700; min-width: 0; }
  .ftag { font-size: .7rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--food); color: #fff; white-space: nowrap; }
  .fshun { font-size: .7rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--food-soft); color: var(--food); border: 1px solid var(--food); white-space: nowrap; }
  .food-card p { font-size: .9rem; color: var(--ink); margin: 0; }

  .empty { text-align: center; color: var(--ink-soft); padding: 36px 16px; border: 1px dashed var(--line); border-radius: 14px; background: var(--surface); }
  footer { margin-top: 42px; text-align: center; color: var(--ink-soft); font-size: .8rem; line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">きせつ観光ナビ</p>
    <h1>どこへ行こう？</h1>
    <p class="lead">行き先・日にち・天気を選ぶと、その季節にぴったりの観光スポットと、ご当地グルメを教えます。</p>
  </header>

  <form class="panel" id="form">
    <div class="field">
      <label for="pref">都道府県<span class="hint">　全国47都道府県から</span></label>
      <select id="pref" name="pref" required>
        <option value="" selected disabled>選んでください</option>
      </select>
    </div>

    <div class="row">
      <div class="field">
        <label for="date">日にち<span class="hint">　季節に反映</span></label>
        <input type="date" id="date" name="date" required>
      </div>
      <div class="field">
        <label for="weather">天気<span class="hint">　雨・雪なら屋内を優先</span></label>
        <select id="weather" name="weather">
          <option value="">おまかせ（季節だけで判断）</option>
          <option value="sunny">☀️ 晴れ</option>
          <option value="cloudy">☁️ くもり</option>
          <option value="rainy">🌧️ 雨</option>
          <option value="snowy">❄️ 雪</option>
        </select>
      </div>
    </div>

    <div class="field">
      <label for="place">地名（任意）<span class="hint">　例：清水、箱根、宮島</span></label>
      <input type="text" id="place" name="place" placeholder="空欄でもOK" autocomplete="off">
    </div>

    <button type="submit" class="go">おすすめを見る</button>
  </form>

  <section class="result" id="result" hidden aria-live="polite"></section>

  <footer>
    掲載スポット・グルメは代表的なものを手作業でまとめたものです。<br>
    お出かけ前に、現地の最新情報・開館時間・旬の時期をご確認ください。
  </footer>
</div>

<script>
// ============================================================
// 季節の定義
// ============================================================
const SEASONS = {
  spring: { label: "春", months: [3,4,5],   color: "var(--spring)", note: "桜や新緑が気持ちいい季節" },
  summer: { label: "夏", months: [6,7,8],   color: "var(--summer)", note: "海・お祭り・涼しい高原がおすすめ" },
  autumn: { label: "秋", months: [9,10,11], color: "var(--autumn)", note: "紅葉や味覚狩りが楽しい季節" },
  winter: { label: "冬", months: [12,1,2],  color: "var(--winter)", note: "雪景色・温泉・あったかグルメの季節" },
};
function seasonOf(month) {
  for (const key in SEASONS) if (SEASONS[key].months.includes(month)) return key;
  return "spring";
}

// ============================================================
// データ  ★増やし方★
//   新しい県を足す  → DATA に "県名": { spots:[...], foods:[...] } を追加
//   スポットを足す  → その県の spots:[] に { } を1つ追加
//     name:見出し / cat:カテゴリ(しぼりこみに自動で出ます) / season:"spring"等 or "all"(通年)
//     in:true=屋内や雨でも楽しめる / desc:説明 / why:ひとこと
//   ご飯を足す      → その県の foods:[] に { } を1つ追加
//     name:料理名 / tag:ジャンル / desc:説明 / season:(旬があれば)"winter"等
// ============================================================
const DATA = {
  "北海道": { spots:[
    { name:"函館山の夜景", cat:"夜景", season:"all", in:false, desc:"日本三大夜景のひとつ。ロープウェイで山頂へ。", why:"一年を通して楽しめる定番。" },
    { name:"富良野のラベンダー畑", cat:"自然", season:"summer", in:false, desc:"紫のじゅうたんが地平線まで続く。", why:"見頃は7月。夏にこそ訪れたい絶景。" },
    { name:"小樽運河", cat:"まち歩き", season:"winter", in:false, desc:"ガス灯と雪が似合うレトロな運河。", why:"冬は雪あかりの路が格別。" },
    { name:"旭山動物園", cat:"おでかけ", season:"all", in:true, desc:"動物の自然な姿が見られる人気の動物園。", why:"屋内展示も多く天気を問わず。冬はペンギン散歩も。" },
    { name:"白い恋人パーク", cat:"おでかけ", season:"all", in:true, desc:"お菓子づくり体験ができる屋内施設。", why:"雨や雪の日でも一日楽しめる。" },
  ], foods:[
    { name:"札幌味噌ラーメン", tag:"麺", desc:"濃厚な味噌スープに縮れ麺。バターとコーンを乗せても。" },
    { name:"海鮮丼・寿司", tag:"海鮮", desc:"ウニ・イクラ・カニが山盛り。市場で食べる朝ごはんは格別。" },
    { name:"ジンギスカン", tag:"肉", desc:"ジンギスカン鍋で焼くラム肉。たっぷりの野菜と一緒に。" },
    { name:"スープカレー", tag:"カレー", desc:"スパイスの効いたサラサラのスープに大きな野菜がごろり。" },
    { name:"毛ガニ", tag:"海鮮", season:"winter", desc:"身がぎっしり、濃厚なカニ味噌。冬の味覚の王様。" },
  ]},
  "青森県": { spots:[
    { name:"弘前公園の桜", cat:"自然", season:"spring", in:false, desc:"お城と約2600本の桜が織りなす名所。", why:"4月下旬〜GWが見頃。春の必見。" },
    { name:"奥入瀬渓流", cat:"自然", season:"autumn", in:false, desc:"滝と渓流が続く散策路。", why:"紅葉の名所。秋の彩りが見事。" },
    { name:"青森ねぶた祭", cat:"祭り", season:"summer", in:false, desc:"大型の灯籠が街を練り歩く夏祭り。", why:"8月上旬開催。夏の東北を代表する祭り。" },
    { name:"三内丸山遺跡", cat:"歴史", season:"all", in:true, desc:"縄文時代の大規模集落跡。世界遺産。", why:"屋内展示もあり天候を問わず学べる。" },
  ], foods:[
    { name:"大間のマグロ", tag:"海鮮", desc:"本州最北で揚がる本マグロ。とろける大トロは絶品。" },
    { name:"のっけ丼", tag:"海鮮", desc:"市場で好きな具を選んでのせる、自分だけの海鮮丼。" },
    { name:"味噌カレー牛乳ラーメン", tag:"麺", desc:"味噌・カレー・牛乳が合わさった青森のご当地麺。" },
    { name:"りんご", tag:"フルーツ", season:"autumn", desc:"生産量日本一。秋はもぎたての蜜入りが味わえる。" },
  ]},
  "岩手県": { spots:[
    { name:"中尊寺金色堂", cat:"歴史", season:"all", in:true, desc:"金色に輝くお堂。世界遺産・平泉の中心。", why:"覆堂の中なので雨でも拝観できる。" },
    { name:"浄土ヶ浜", cat:"景色", season:"summer", in:false, desc:"白い岩と青い海のコントラストが美しい海岸。", why:"夏は遊覧船やウミネコ観察が楽しい。" },
    { name:"龍泉洞", cat:"自然", season:"all", in:true, desc:"透き通る地底湖で知られる鍾乳洞。", why:"洞内は一年中ひんやり。天気を問わず。" },
    { name:"小岩井農場", cat:"おでかけ", season:"spring", in:false, desc:"岩手山を望む広大な牧場。", why:"新緑の春〜初夏が気持ちいい。" },
  ], foods:[
    { name:"わんこそば", tag:"麺", desc:"給仕さんが次々とそばを足してくれる、食べ比べが楽しい名物。" },
    { name:"盛岡冷麺", tag:"麺", desc:"コシの強い透明な麺に、キムチと果物のさっぱりスープ。" },
    { name:"じゃじゃ麺", tag:"麺", desc:"平打ち麺に肉味噌ときゅうり。最後は卵スープで締める。" },
    { name:"前沢牛", tag:"肉", desc:"きめ細かな霜降りのブランド和牛。とろける食感。" },
  ]},
  "宮城県": { spots:[
    { name:"松島", cat:"景色", season:"all", in:false, desc:"大小の島々が浮かぶ日本三景。", why:"遊覧船で巡れ、四季それぞれ美しい。" },
    { name:"瑞巌寺", cat:"歴史", season:"all", in:true, desc:"伊達政宗ゆかりの古刹。", why:"堂内拝観で雨でも楽しめる。" },
    { name:"蔵王のお釜", cat:"自然", season:"summer", in:false, desc:"エメラルドグリーンの火口湖。", why:"道路が開く夏が見頃。" },
    { name:"仙台光のページェント", cat:"夜景", season:"winter", in:false, desc:"けやき並木がきらめく冬の風物詩。", why:"12月の夜のおでかけに。" },
  ], foods:[
    { name:"牛タン焼き", tag:"肉", desc:"厚切りで肉厚、炭火で香ばしく。麦飯とテールスープが定番。" },
    { name:"ずんだ餅", tag:"スイーツ", desc:"すり潰した枝豆の餡をまとった、鮮やかな緑のお餅。" },
    { name:"笹かまぼこ", tag:"練り物", desc:"笹の形の上品なかまぼこ。焼きたてはふんわり。" },
    { name:"牡蠣", tag:"海鮮", season:"winter", desc:"三陸の濃厚な牡蠣。焼き・蒸し・生、どれも絶品。" },
  ]},
  "秋田県": { spots:[
    { name:"角館の武家屋敷", cat:"まち歩き", season:"spring", in:false, desc:"黒板塀にしだれ桜が映える「みちのくの小京都」。", why:"桜の春がとりわけ美しい。" },
    { name:"田沢湖", cat:"景色", season:"all", in:false, desc:"日本一深い瑠璃色の湖。", why:"湖畔のたつこ像とともに通年楽しめる。" },
    { name:"乳頭温泉郷", cat:"温泉", season:"winter", in:true, desc:"山あいの秘湯が集まる温泉郷。", why:"雪見の露天風呂は冬の醍醐味。" },
    { name:"なまはげ館", cat:"歴史", season:"all", in:true, desc:"男鹿のなまはげ文化を学べる施設。", why:"屋内なので天気を問わない。" },
  ], foods:[
    { name:"きりたんぽ鍋", tag:"鍋", season:"winter", desc:"つぶしたご飯の棒を比内地鶏の出汁でぐつぐつ。冬の定番。" },
    { name:"稲庭うどん", tag:"麺", desc:"手延べの細くつるりとしたうどん。のど越し抜群。" },
    { name:"比内地鶏", tag:"肉", desc:"日本三大地鶏のひとつ。うまみの濃い出汁と歯ごたえ。" },
    { name:"ハタハタ", tag:"海鮮", season:"winter", desc:"冬の秋田を代表する魚。しょっつる鍋や焼きで。" },
  ]},
  "山形県": { spots:[
    { name:"山寺(立石寺)", cat:"歴史", season:"autumn", in:false, desc:"千段超の石段の上に建つ絶景の古刹。", why:"紅葉に包まれる秋が見事。" },
    { name:"銀山温泉", cat:"温泉", season:"winter", in:true, desc:"ガス灯と木造旅館が並ぶ大正ロマンの温泉街。", why:"雪景色に灯りが灯る冬が幻想的。" },
    { name:"蔵王樹氷", cat:"自然", season:"winter", in:false, desc:"樹氷(スノーモンスター)が広がる雪原。", why:"冬だけ見られる自然の造形。" },
    { name:"羽黒山五重塔", cat:"歴史", season:"all", in:false, desc:"杉並木の中に立つ国宝の塔。", why:"荘厳な杉木立は通年の見どころ。" },
  ], foods:[
    { name:"米沢牛", tag:"肉", desc:"甘みのある上質な霜降り。すき焼きやステーキで。" },
    { name:"芋煮", tag:"鍋", season:"autumn", desc:"里芋・牛肉・こんにゃくの鍋。秋は河原で芋煮会。" },
    { name:"山形そば", tag:"麺", desc:"太くてコシのある田舎そば。板そばでどうぞ。" },
    { name:"さくらんぼ", tag:"フルーツ", season:"summer", desc:"初夏が旬の佐藤錦。ルビー色の宝石のような甘さ。" },
  ]},

// ============================================================
// 画面を組み立てる
// ============================================================
const prefSelect = document.getElementById("pref");
Object.keys(DATA).forEach(p => {
  const o = document.createElement("option");
  o.value = p; o.textContent = p;
  prefSelect.appendChild(o);
});

const dateInput = document.getElementById("date");
dateInput.value = new Date().toISOString().slice(0, 10);

const form = document.getElementById("form");
const result = document.getElementById("result");

// しぼりこみの状態（今回の表示ぶんだけ保持）
let current = null;      // { pref, sKey, rainy, place, spots, foods, season, dateLabel }
let activeCat = "すべて";

form.addEventListener("submit", (e) => {
  e.preventDefault();
  const pref = prefSelect.value;
  const dateStr = dateInput.value;
  const weather = document.getElementById("weather").value;
  const place = document.getElementById("place").value.trim();
  if (!pref || !dateStr) return;

  const month = Number(dateStr.slice(5, 7));
  const sKey = seasonOf(month);
  const season = SEASONS[sKey];
  const rainy = (weather === "rainy" || weather === "snowy");

  // スポットの並べ替え（季節を優先、雨・雪なら屋内を上に）
  const score = (spot) => {
    let s = (spot.season === sKey) ? 0 : (spot.season === "all" ? 10 : 20);
    if (rainy && !spot.in) s += 15;   // 雨・雪の日は屋外を少し下げる
    return s;
  };
  const spots = DATA[pref].spots.slice().sort((a, b) => score(a) - score(b));

  // ご飯も旬を優先
  const foods = DATA[pref].foods.slice().sort((a, b) => {
    const fa = (a.season === sKey) ? 0 : 1;
    const fb = (b.season === sKey) ? 0 : 1;
    return fa - fb;
  });

  const d = new Date(dateStr + "T00:00:00");
  const dateLabel = `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`;

  const weatherLabel = { sunny:"☀️ 晴れ", cloudy:"☁️ くもり", rainy:"🌧️ 雨", snowy:"❄️ 雪" }[weather] || "";

  current = { pref, sKey, rainy, place, spots, foods, season, dateLabel, weatherLabel };
  activeCat = "すべて";
  render();
  result.scrollIntoView({ behavior: "smooth", block: "start" });
});

function render() {
  const { pref, sKey, rainy, place, spots, foods, season, dateLabel, weatherLabel } = current;

  // カテゴリ一覧
  const cats = ["すべて", ...Array.from(new Set(spots.map(s => s.cat)))];

  // 表示するスポット（カテゴリしぼりこみ）
  let shown = (activeCat === "すべて") ? spots : spots.filter(s => s.cat === activeCat);

  let html = `
    <div class="result-head"><h2>${pref}のおすすめ</h2></div>
    <div class="tags">
      <span class="chip-tag" style="--accent:${season.color}">${dateLabel}は「${season.label}」</span>
      ${weatherLabel ? `<span class="chip-tag">${weatherLabel}</span>` : ""}
    </div>
    <p class="result-note">${season.note}。${rainy ? "雨・雪の日なので、屋内で楽しめるスポットを上に並べています。" : "この季節に合うスポットを上に並べています。"}</p>
    <div class="filters">
      ${cats.map(c => `<button type="button" data-cat="${escapeHtml(c)}" aria-pressed="${c === activeCat}">${escapeHtml(c)}</button>`).join("")}
    </div>
  `;

  html += `<div class="cards">`;
  if (shown.length === 0) {
    html += `<div class="empty">このカテゴリのスポットはありません。</div>`;
  }
  shown.forEach(spot => {
    const isSeason = spot.season === sKey;
    const isAll = spot.season === "all";
    const sc = isAll ? "var(--accent)" : SEASONS[spot.season].color;
    const badgeLabel = isAll ? "通年おすすめ" : SEASONS[spot.season].label + "が見頃";
    const hit = place && (spot.name.includes(place) || spot.desc.includes(place));
    const rainPick = rainy && spot.in;
    html += `
      <article class="card" style="--seasonc:${sc}">
        <div class="card-top">
          <h3>${escapeHtml(spot.name)}</h3>
          <span class="badge">${badgeLabel}</span>
          <span class="badge cat">${escapeHtml(spot.cat)}</span>
          ${isSeason ? `<span class="pick">今の季節にぴったり</span>` : ""}
          ${rainPick ? `<span class="pick rain">雨でもOK</span>` : ""}
          ${hit ? `<span class="pick">地名が一致</span>` : ""}
        </div>
        <p>${escapeHtml(spot.desc)}</p>
        <p class="why">💡 ${escapeHtml(spot.why)}</p>
      </article>`;
  });
  html += `</div>`;

  // ご飯セクション
  html += `
    <section class="food-sec">
      <div class="food-head"><span style="font-size:1.4rem">🍚</span><h2>${pref}のご飯</h2></div>
      <p class="food-sub">旅のもうひとつの主役。ご当地グルメをどうぞ（旬のものは上に）。</p>
      <div class="food-grid">`;
  foods.forEach(f => {
    const shun = f.season === sKey;
    html += `
      <div class="food-card">
        <div class="ftop">
          <h4>${escapeHtml(f.name)}</h4>
          <span class="ftag">${escapeHtml(f.tag)}</span>
          ${shun ? `<span class="fshun">今が旬</span>` : ""}
        </div>
        <p>${escapeHtml(f.desc)}</p>
      </div>`;
  });
  html += `</div></section>`;

  result.innerHTML = html;
  result.hidden = false;

  // カテゴリボタンの動作
  result.querySelectorAll(".filters button").forEach(btn => {
    btn.addEventListener("click", () => {
      activeCat = btn.dataset.cat;
      render();
    });
  });
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));
}
</script>
</body>
</html>
