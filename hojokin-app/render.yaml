# Render（無料プラン）に「2つ目のサービス」として出すための設定。
# Render のダッシュボードで New > Blueprint を選び、このリポジトリを指定し、
# Root Directory に hojokin-app を指定すると、このファイルが使われます。
services:
  - type: web
    name: hojokin-app
    runtime: python
    plan: free
    rootDir: hojokin-app
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: VAPID_PUBLIC
        sync: false
      - key: VAPID_PRIVATE
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:hojokin-app@example.com
      - key: CHECK_TOKEN
        sync: false
      - key: CHECK_INTERVAL
        value: "3600"
